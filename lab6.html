<title>Pixie Edit — Lab 6</title>
<meta name="pixie-version" content="lab6-lens-v6">
<style>
  :root { --safe-t: env(safe-area-inset-top); --safe-b: env(safe-area-inset-bottom); --acc: #c8ff4d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font: 15px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; overscroll-behavior: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  [hidden] { display: none !important; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; }
  .screen.on { display: flex; }
  /* lock */
  #lock { background: #f4f1ea; color: #1d1b19; align-items: center; justify-content: center; gap: 22px; }
  #lock .logo { width: 84px; height: 84px; border-radius: 24px; background-size: cover; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
  #lock h2 { margin: 0; font-size: 20px; }
  .pins { display: flex; gap: 14px; height: 16px; }
  .pins i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #1d1b19; }
  .pins i.f { background: #1d1b19; }
  .pins.shake { animation: sh .35s; } @keyframes sh { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px; margin-top: 8px; }
  .pad button { width: 76px; height: 76px; border-radius: 50%; background: #fff; font-size: 30px; box-shadow: 0 1px 0 #e5e0d8; color: #1d1b19; }
  .pad .ghost { background: none; box-shadow: none; font-size: 16px; color: #8a847d; }
  #lockMsg { color: #8a847d; font-size: 14px; min-height: 18px; }
  /* home */
  #home { align-items: center; justify-content: center; gap: 18px; background: #0b0b0b; }
  #home .logo { width: 96px; height: 96px; border-radius: 27px; background-size: cover; }
  #home h1 { margin: 0; font-size: 26px; }
  #home p { margin: 0; color: #9a9a9a; }
  .big { background: var(--acc); color: #000; font-weight: 700; padding: 16px 34px; border-radius: 30px; font-size: 17px; }
  /* editor */
  #ed { background: #000; }
  #top { display: flex; align-items: center; justify-content: space-between; padding: calc(var(--safe-t) + 8px) 14px 6px; height: calc(var(--safe-t) + 52px); }
  .ib { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; }
  .ib svg { width: 24px; height: 24px; }
  #stage { flex: 1; position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
  #view { max-width: 100%; max-height: 100%; display: block; border-radius: 6px; touch-action: none; }
  .side { position: absolute; left: 10px; bottom: 6px; display: flex; flex-direction: column; gap: 14px; align-items: center; z-index: 3; }
  .side button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .side svg { width: 26px; height: 26px; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
  .side button:disabled { opacity: .35; }
  #ctl { display: flex; align-items: center; gap: 6px; padding: 4px 14px 2px; height: 50px; background: #000; }
  #ctl > button { width: 40px; height: 40px; display: grid; place-items: center; flex: none; }
  #ctl > button svg { width: 24px; height: 24px; }
  #ctl > button:disabled { opacity: .35; }
  #rowSl { flex: 1; display: flex; align-items: center; padding: 0 10px; }
  #rowSl input { width: 100%; }
  .topr { display: flex; align-items: center; gap: 10px; }
  .adv { display: flex; align-items: center; gap: 6px; background: #2b2b2b; padding: 9px 14px; border-radius: 9px; font-size: 16px; }
  .exp { background: var(--acc); color: #000; font-weight: 700; padding: 9px 18px; border-radius: 9px; font-size: 16px; }
  #advMenu { position: absolute; right: 14px; top: calc(100% - 2px); background: #262626; border-radius: 12px; z-index: 12; min-width: 210px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  #advMenu button { display: flex; justify-content: space-between; width: 100%; padding: 13px 16px; text-align: left; border-bottom: 1px solid #333; }
  #advMenu button.on { color: var(--acc); }
  #top { position: relative; }
  #sliders { position: absolute; left: 0; right: 0; bottom: 58px; padding: 0 16px; z-index: 3; display: flex; flex-direction: column; gap: 2px; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .sl { display: flex; align-items: center; gap: 12px; height: 38px; }
  .sl label { width: 108px; font-size: 14px; white-space: nowrap; }
  .sl label b { font-weight: 600; margin-left: 4px; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 28px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: rgba(255,255,255,.55); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; margin-top: -12px; box-shadow: 0 1px 6px rgba(0,0,0,.5); }
  #panel { background: #000; padding-bottom: var(--safe-b); }
  .cats { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding: 8px 10px 4px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cats button { padding: 6px 12px; color: #a8a8a8; font-size: 14px; white-space: nowrap; border-radius: 16px; flex: none; }
  .cats button.on { color: #fff; font-weight: 600; }
  .cats .pill { margin-left: auto; background: #2b2b2b; color: #fff; position: sticky; right: 0; }
  .cats .pill.on { background: #fff; color: #000; }

<script>
"use strict";

const $ = (id) => document.getElementById(id);
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
function toast(t, ms = 2400) { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", ms); }
function busy(on, t) { $("busy").classList.toggle("on", on); if (t) $("busyText").textContent = t; }


const VS = `attribute vec2 p; varying vec2 v; void main(){ v = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;
const COPY_FS = `precision mediump float; varying vec2 v; uniform sampler2D src; void main(){ gl_FragColor = texture2D(src, v); }`;
const BLUR_FS = `precision mediump float; varying vec2 v; uniform sampler2D src; uniform vec2 dir;
void main(){ vec3 a = vec3(0.0); float ws = 0.0;
  for (int i = -4; i <= 4; i++) { float f = float(i); float w = exp(-f*f/6.0); a += texture2D(src, v + dir*f).rgb * w; ws += w; }
  gl_FragColor = vec4(a/ws, 1.0); }`;
const COMMON = `
float luma(vec3 c){ return dot(c, vec3(.2126,.7152,.0722)); }
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }   // Lab6: sine-free everywhere (the old hashS algorithm). Lab5 only used it for two jitter taps; vn/fbm/grain still used sine hash, which loses precision at photo-size coordinates on phone GPUs.
vec3 scr(vec3 a, vec3 b){ return 1.0 - (1.0 - a) * (1.0 - clamp(b, 0.0, 1.0)); }
vec3 satv(vec3 c, float s){ return mix(vec3(luma(c)), c, s); }
vec3 hl(vec3 c, float t){ return max(c - t, 0.0) / (1.0 - t); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1.,0.)), f.x), mix(hash(i+vec2(0.,1.)), hash(i+vec2(1.,1.)), f.x), f.y); }
float fbm(vec2 p){ float a = 0.5, t = 0.0; for (int i = 0; i < 4; i++) { t += a * vn(p); p = p * 2.03 + 17.3; a *= 0.5; } return t / 0.9375; }
float hashS(vec2 p){ return hash(p); }   // kept for call-site compatibility; hash() itself is sine-free now
vec3 hsv2rgb(vec3 c){ vec3 p=abs(fract(c.xxx+vec3(1.,2./3.,1./3.))*6.-3.); return c.z*mix(vec3(1.),clamp(p-1.,0.,1.),c.y); }
`;

// Lab6: the Lab5 half-float optical stack (LIN_FS / BLUR4_FS / COPY4_FS / HALO_FS / LENS_FS)
// is removed. Its dedicated lens shader was never called, its halo pass added nothing on
// indoor photos (zero extracted light), and the silent 8-bit fallback made different
// versions render pixel-identically. Lens Smudge v6 runs in the standard pipeline below,
// identically on every device.

const COL_FS = `precision highp float; varying vec2 v; uniform sampler2D src; uniform vec2 res; uniform float seed;
uniform float bri, con, sat, shp, hi, sh, temp, tint, fade, grain, vig, flash; uniform vec2 fc;
uniform float fk; uniform vec3 fLift, fGain, fShadow, fHigh; uniform vec3 fP;
` + COMMON + `
void main(){
  vec3 c = texture2D(src, v).rgb;
  if (shp != 0.0) { vec2 t = 1.0 / res * 1.2;
    vec3 n = (texture2D(src, v + vec2(t.x,0.)).rgb + texture2D(src, v - vec2(t.x,0.)).rgb + texture2D(src, v + vec2(0.,t.y)).rgb + texture2D(src, v - vec2(0.,t.y)).rgb) * 0.25;
    c += (c - n) * shp * 2.2; }
  if (fk > 0.0) {
    vec3 f = c; float L0 = luma(f);
    f = (f - 0.5) * fP.x + 0.5; f = mix(vec3(luma(f)), f, fP.y);
    f = f * fGain + fLift; f = f * (1.0 - fP.z) + fP.z * 0.5;
    float L = luma(f); f += fShadow * (1.0 - L) * 0.14 + fHigh * L * 0.12;
    c = mix(c, f, fk);
  }
  c *= exp2(bri * 0.7);
  c = (c - 0.5) * (1.0 + con * 0.6) + 0.5;
  float L = luma(c);
  c = mix(vec3(L), c, 1.0 + sat);
  c += hi * 0.22 * smoothstep(0.45, 1.0, L);
  c += sh * 0.22 * (1.0 - smoothstep(0.0, 0.55, L));
  c.r += temp * 0.09; c.b -= temp * 0.09; c.g -= tint * 0.06; c.r += tint * 0.03; c.b += tint * 0.03;
  c = c * (1.0 - fade * 0.3) + fade * 0.15;
  if (flash > 0.0) {
    float asp = res.x / res.y; vec2 d = (v - fc) * vec2(asp, 1.0); float r2 = dot(d, d);
    float lf = exp(-r2 * 2.4);
    vec3 b = c;
    c *= 1.0 + flash * 0.75 * lf;
    c = (c - 0.5) * (1.0 + 0.3 * flash * lf) + 0.5;
    c *= 1.0 - flash * 0.3 * (1.0 - lf);
    c = mix(c, c * vec3(1.04, 1.02, 1.0) + vec3(0.02), flash * lf * 0.6);
    c = satv(c, 1.0 - 0.18 * flash * lf);
    float over = max(luma(c) - 0.8, 0.0);
    c += over * flash * vec3(1.0, 0.98, 0.95) * 0.35;
  }
  if (vig != 0.0) { vec2 d = (v - 0.5) * vec2(res.x / res.y, 1.0); float r = length(d);
    float m = smoothstep(0.25, 0.9, r); c *= 1.0 - m * vig * 0.8; c += max(-vig, 0.0) * m * 0.25; }
  if (grain > 0.0) c += (hash(v * res + seed) - 0.5) * grain * 0.25;
  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
}`;

const FX_FS = `precision highp float; varying vec2 v; uniform sampler2D src, bh, bq; uniform vec2 res; uniform float fid, seed; uniform vec4 P, P2; uniform vec2 lc;
` + COMMON + `
bool is(float n){ return abs(fid - n) < 0.5; }
void main(){
  vec2 uv = v; vec3 c = texture2D(src, uv).rgb; float asp = res.x / res.y;
  vec2 pc = (uv - 0.5) * vec2(asp, 1.0); float r = length(pc);
  vec3 H = texture2D(bh, uv).rgb, Q = texture2D(bq, uv).rgb;
  float n1 = hash(uv * res + seed) - 0.5;
  if (is(1.0)) { // Vignette: P.x intensity, P.y size
    float m = smoothstep(0.12 + P.y * 0.45, 0.95, r * 1.25); c *= 1.0 - m * P.x * 0.9;
  } else if (is(2.0)) { // Noise
    c += n1 * P.x * 0.38 + (hash(uv * res + seed + 7.0) - 0.5) * P.x * 0.12;
  } else if (is(3.0)) { // Heavy noise
    vec2 g = floor(uv * res / 1.7);
    c += (hash(g + seed) - 0.5) * P.x * 0.8 + vec3(hash(g + seed + 3.0), hash(g + seed + 5.0), hash(g + seed + 9.0)) * P.x * 0.12 - P.x * 0.06;
  } else if (is(4.0)) { // Soft haze
    c = mix(c, H, P.x * 0.6); c = c * (1.0 - 0.2 * P.x) + 0.2 * P.x * vec3(0.93, 0.95, 1.0);
  } else if (is(5.0)) { // Low quality
    float bs = mix(1.0, 7.0, P.x) * res.x / 1000.0; vec2 q = floor(uv * res / bs) * bs / res + 0.5 * bs / res;
    vec3 l = texture2D(src, q).rgb; l.r = texture2D(src, q + vec2(0.002 * P.x, 0.0)).r; l.b = texture2D(src, q - vec2(0.002 * P.x, 0.0)).b;
    l = mix(l, H, 0.35); l = satv(l, 0.85); l = (l - 0.5) * 0.92 + 0.52; l += n1 * 0.05 * P.x;
    c = mix(c, l, min(1.0, P.x * 1.4));
  } else if (is(6.0)) { // CCD quality: P.x grain, P.y intensity
    vec2 o = (uv - 0.5) * 0.007 * P.y; vec3 d = vec3(texture2D(src, uv + o).r, c.g, texture2D(src, uv - o).b);
    d = mix(d, H, 0.22); d += (c - H) * 0.5;
    d = scr(d, hl(Q, 0.5) * 0.38 + hl(H, 0.6) * 0.2);
    d = satv(d, 1.04); d = (d - 0.5) * 1.03 + 0.5; d = d * 0.95 + 0.04; d *= vec3(0.975, 1.0, 1.045);
    d += n1 * (0.012 + 0.2 * P.x) + (hash(uv * res + seed + 4.0) - 0.5) * 0.1 * P.x;
    c = mix(c, d, P.y);
  } else if (is(7.0)) { // Overlay glass
    float fx = fract(uv.x * 26.0) - 0.5; vec2 u2 = uv + vec2(fx * 0.018 * P.x, 0.0);
    vec3 g = mix(texture2D(src, u2).rgb, H, 0.45);
    g = scr(g, vec3(0.1 * P.x)) ; g *= 1.0 - abs(fx) * 0.16 * P.x; g = mix(g, vec3(0.94, 0.96, 1.0), 0.1 * P.x);
    c = mix(c, g, min(1.0, P.x * 1.3));
  } else if (is(8.0)) { // Ray blur (radial)
    vec3 a = vec3(0.0); for (int i = 0; i < 14; i++) { float t = float(i) / 14.0; a += texture2D(src, mix(uv, vec2(0.5), t * 0.11 * P.x)).rgb; }
    a /= 14.0; a = scr(a, hl(a, 0.6) * 0.4 * P.x); c = mix(c, a, min(1.0, P.x * 1.4));
  } else if (is(9.0)) { // Horizontal blur
    vec3 a = vec3(0.0); for (int i = -7; i <= 7; i++) a += texture2D(src, uv + vec2(float(i) * P.x * 0.0028, 0.0)).rgb; a /= 15.0;
    c = mix(c, scr(a, hl(a, 0.65) * 0.25 * P.x), min(1.0, P.x * 1.5));
  } else if (is(10.0)) { // Defocus
    c = mix(c, H, P.x * 0.85); c = scr(c, hl(Q, 0.5) * 0.5 * P.x);
  } else if (is(11.0)) { // Glowing 1: P.x size, P.y opacity
    vec3 g = mix(H, Q, P.x); c = scr(c, hl(g, 0.35) * vec3(1.0, 0.97, 1.0) * 1.25 * P.y);
  } else if (is(12.0)) { // Glowing 2 (warm)
    vec3 g = mix(H, Q, P.x); c = scr(c, hl(g, 0.3) * vec3(1.1, 0.95, 0.78) * 1.35 * P.y); c *= mix(vec3(1.0), vec3(1.04, 1.0, 0.94), P.y);
  } else if (is(13.0)) { // Glowing 3 (veil)
    vec3 g = mix(H, Q, P.x); c = mix(c, g, 0.42 * P.y); c = scr(c, hl(g, 0.3) * 1.1 * P.y); c = c * (1.0 - 0.1 * P.y) + 0.1 * P.y * vec3(1.0, 0.97, 0.98);
  } else if (is(14.0)) { // Smear light: P.x size, P.y opacity
    vec3 a = vec3(0.0); float ws = 0.0;
    for (int i = -12; i <= 12; i++) { float f = float(i); float w = exp(-abs(f) / 6.0); a += hl(texture2D(bh, uv + vec2(f * P.x * 0.03, 0.0)).rgb, 0.45) * w; ws += w; }
    a /= ws; c = scr(c, a * vec3(0.88, 0.84, 1.15) * 2.0 * P.y); c = scr(c, hl(Q, 0.5) * 0.25 * P.y);
  } else if (is(15.0)) { // Dim light
    c *= mix(1.0, 0.7, P.x); c = scr(c, hl(Q, 0.4) * vec3(1.1, 0.9, 0.7) * 0.9 * P.x); c *= 1.0 - smoothstep(0.3, 1.0, r) * 0.35 * P.x;
  } else if (is(16.0)) { // Rainbow leak
    float t = uv.x * 0.9 + (1.0 - uv.y) * 0.5; float m = exp(-pow((t - 0.32) * 3.2, 2.0));
    vec3 rb = hsv2rgb(vec3(fract(t * 1.6 + 0.02), 0.65, 1.0)); c = scr(c, rb * m * 0.5 * P.x);
  } else if (is(17.0)) { // Blinds
    float s = 0.5 + 0.5 * sin((uv.x * asp * 0.8 + uv.y * 0.55) * (10.0 + 40.0 * P.y)); s = smoothstep(0.25, 0.75, s);
    c *= 1.0 - 0.5 * P.x * (1.0 - s); c = scr(c, vec3(1.0, 0.92, 0.78) * 0.16 * s * P.x);
  } else if (is(19.0)) { // Exposure: P.x rotate, P.y displacement, P.z intensity, P.w filters
    float a = P.x * 6.2832; float ca = cos(a * 0.25), sa = sin(a * 0.25);
    vec2 q = pc; q = vec2(q.x * ca - q.y * sa, q.x * sa + q.y * ca);
    vec2 g = q / vec2(asp, 1.0) * (1.0 + 0.2 * P.y) + 0.5 + vec2(cos(a), sin(a)) * P.y * 0.38;
    vec3 gh = texture2D(bh, g).rgb;
    float gl = luma(gh); vec3 tinted = vec3(gl) * vec3(0.82, 0.93, 1.14) + 0.1; gh = mix(gh, tinted, P.w);
    float k = clamp(P.z * 2.0, 0.0, 1.0);
    c = mix(c, scr(c, gh * 1.05), k); c = mix(c, c * 0.84 + 0.16 * vec3(0.95, 0.98, 1.04), P.z * 0.55); c = scr(c, hl(Q, 0.5) * 0.3 * P.z);
  } else if (is(20.0)) { // Lo-Fi
    vec3 l = mix(c, H, 0.22); l.r = texture2D(src, uv + vec2(0.0025, 0.0)).r * 0.6 + l.r * 0.4; l = satv(l, 0.72); l = l * 0.88 + vec3(0.04, 0.06, 0.075);
    l += n1 * 0.08; l *= 1.0 - smoothstep(0.35, 1.0, r) * 0.4; c = mix(c, l, P.x);
  } else if (is(21.0)) { // Dual frame: P.x size, P.y opacity
    vec2 o = vec2(0.055, -0.045) * (0.4 + P.x); vec2 ug = (uv - 0.5) / 0.86 + 0.5 - o;
    vec3 gh = texture2D(bh, ug).rgb; gh = vec3(luma(gh)) * vec3(1.15, 0.45, 0.8) + vec3(0.18, 0.02, 0.12);
    float inG = step(0.0, ug.x) * step(ug.x, 1.0) * step(0.0, ug.y) * step(ug.y, 1.0);
    c = mix(c, scr(c * 0.8, gh), inG * P.y * 0.85);
    float e = max(abs(ug.x - 0.5), abs(ug.y - 0.5)); c = mix(c, vec3(1.0), inG * smoothstep(0.495, 0.5, e) * P.y * 0.8);
  } else if (is(22.0)) { // Smudging: swirly smear + moody dark
    vec2 w = vec2(sin(uv.y * 9.0 + sin(uv.x * 5.0) * 2.0), cos(uv.x * 8.0 + sin(uv.y * 6.0) * 2.0)) * 0.05 * P.x;
    vec3 sm = mix(texture2D(bh, uv + w).rgb, texture2D(bq, uv + w * 1.6).rgb, 0.5);
    sm = sm * 0.78 + vec3(0.0, 0.005, 0.02); c = mix(c, sm, min(1.0, P.x * 1.15));
  } else if (is(23.0)) { // Radial blur (sharp centre)
    float m = smoothstep(0.1, 0.65, r); vec3 a = vec3(0.0);
    for (int i = 0; i < 12; i++) { float t = float(i) / 12.0; a += texture2D(src, mix(uv, vec2(0.5), t * 0.22 * P.x * (0.4 + m))).rgb; }
    a /= 12.0; c = mix(c, a, m * min(1.0, P.x * 1.5));
  } else if (is(24.0)) { // Tipsy: doubled ghost, warm cast
    vec3 g1 = texture2D(bh, uv + vec2(0.02, 0.006) * P.x * 2.0).rgb, g2 = texture2D(bh, uv - vec2(0.02, 0.004) * P.x * 2.0).rgb;
    vec3 t = mix(c, (g1 + g2) * 0.5, 0.55 * min(1.0, P.x * 1.4)); t *= mix(vec3(1.0), vec3(1.12, 0.92, 0.72), P.x); t = scr(t, hl(Q, 0.45) * vec3(1.0, 0.6, 0.35) * 0.5 * P.x);
    c = t;
  } else if (is(25.0)) { // Wavy blur
    vec2 w = vec2(sin(uv.y * 22.0 + seed) * 0.016 * P.x, sin(uv.x * 18.0) * 0.006 * P.x);
    c = mix(texture2D(src, uv + w).rgb, texture2D(bh, uv + w).rgb, 0.45 * min(1.0, P.x * 1.3));

    for (const k in tex) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex[k]); this.set(pr, k, unit, true); unit++; }
    for (const k in uni) this.set(pr, k, uni[k]);

  }
  set(pr, k, val, isInt) {
    const gl = this.gl; if (!(k in pr.u)) pr.u[k] = gl.getUniformLocation(pr.p, k); const l = pr.u[k]; if (l == null) return;

  blurChain(inT) {
    const T = this.T, hx = [1 / T.H1.w * 1.25, 0], hy = [0, 1 / T.H1.h * 1.25], qx = [1 / T.Q1.w * 1.6, 0], qy = [0, 1 / T.Q1.h * 1.6];
    this.pass("copy", T.H1, { src: inT }, {});
    for (let i = 0; i < 2; i++) { this.pass("blur", T.H2, { src: T.H1.t }, { dir: hx }); this.pass("blur", T.H1, { src: T.H2.t }, { dir: hy }); }
    this.pass("copy", T.Q1, { src: T.H1.t }, {});
    for (let i = 0; i < 3; i++) { this.pass("blur", T.Q2, { src: T.Q1.t }, { dir: qx }); this.pass("blur", T.Q1, { src: T.Q2.t }, { dir: qy }); }
  }
  draw(S, orig) {

    const a = S.adj, f = S.filter, fl = f ? FILTERS[f[0]][f[1]] : null;
    const u = { res: [this.W, this.H], seed: 3.0, bri: a.bri / 100, con: a.con / 100, sat: a.sat / 100, shp: a.shp / 100, hi: a.hi / 100, sh: a.sh / 100,
      temp: a.temp / 100, tint: a.tint / 100, fade: a.fade / 100, grain: a.grain / 100, vig: a.vig / 100, flash: a.flash / 100, fc: S.fc || [0.5, 0.45],
      fk: fl ? f[2] / 100 : 0, fLift: fl ? fl[1] : [0, 0, 0], fGain: fl ? fl[2] : [1, 1, 1], fShadow: fl ? fl[6] : [0, 0, 0], fHigh: fl ? fl[7] : [0, 0, 0], fP: fl ? [fl[3], fl[4], fl[5]] : [1, 1, 0] };

  }
}


const MAXFULL = 2400, MAXPREV = 1400;
let R1 = null, TR = null;                // preview renderer, thumbnail renderer
let XR = null;

let orig = null;                         // original imported photo (preview-size canvas)
let baseFull = null, basePrev = null;    // current baked base
let S = fresh();
let hist = [], hi = -1, tool = "effects", fxTab = 0, fltTab = 1, adjKey = "bri", editing = false;
function fresh() { return { adj: { ...ADJ_DEFAULT }, filter: null, fx: null, fc: [0.5, 0.45], lc: [0.5, 0.6] }; }
const clone = (o) => JSON.parse(JSON.stringify(o));

function scaled(src, max) {
  const k = Math.min(1, max / Math.max(src.width, src.height)), c = document.createElement("canvas");
  c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  const x = c.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(src, 0, 0, c.width, c.height); return c;
}
function snap() { hist = hist.slice(0, hi + 1); hist.push({ S: clone(S), full: baseFull, prev: basePrev }); hi = hist.length - 1; syncBtns(); }
function restore(h) {
  S = clone(h.S); const changed = h.prev !== basePrev; baseFull = h.full; basePrev = h.prev;
  if (changed) R1.setSource(basePrev);
  syncBtns(); render(); buildPanel(true);
}
function syncBtns() { $("undoBtn").disabled = hi <= 0; $("redoBtn").disabled = hi >= hist.length - 1; }
let renderQueued = false;
function render() {   // Lab6: slider drags fire dozens of events/sec; Lab5 ran the full pipeline for each one.
  if (!R1 || renderQueued) return; renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; if (R1) R1.draw(S, false); });
}


$("pick").onclick = () => $("file").click();
$("file").onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  busy(true, "Opening…");
  try {
    let bmp;
    try { bmp = await createImageBitmap(f, { imageOrientation: "from-image" }); }
    catch (err) { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); }); }
    const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
    const raw = document.createElement("canvas"); raw.width = w; raw.height = h; raw.getContext("2d").drawImage(bmp, 0, 0);
    baseFull = scaled(raw, MAXFULL); basePrev = scaled(baseFull, MAXPREV); orig = basePrev;
    S = fresh(); hist = []; hi = -1; tool = "effects"; editing = false;
    show("ed");
    if (!R1) R1 = new R($("view"));
    R1.setSource(basePrev); sizeView(); snap(); render(); buildPanel(); makeThumbs();
  } catch (err) { toast("Couldn't open that photo (" + (err.message || err) + ")"); }

};
function sizeView() {
  const v = $("view"); const st = $("stage").getBoundingClientRect();
  const k = Math.min((st.width - 12) / v.width, (st.height - 8) / v.height);
  v.style.width = Math.floor(v.width * k) + "px"; v.style.height = Math.floor(v.height * k) + "px";
}
addEventListener("resize", () => { if ($("ed").classList.contains("on")) sizeView(); });
$("xBtn").onclick = () => show("home");


(() => { const b = $("cmpBtn");
  const down = (e) => { e.preventDefault(); if (R1) { R1.setSource(orig); R1.draw(S, true); } };
  const up = () => { if (R1) { R1.setSource(basePrev); render(); } };
  b.addEventListener("pointerdown", down); b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up); b.addEventListener("pointerleave", up); })();


$("undoBtn").onclick = () => { if (hi > 0) { hi--; restore(hist[hi]); } };
$("redoBtn").onclick = () => { if (hi < hist.length - 1) { hi++; restore(hist[hi]); } };
$("mergeBtn").onclick = async () => {
  if (!S.fx && !S.filter && !Object.keys(S.adj).some(k => S.adj[k] !== 0)) return toast("Nothing to merge yet. Add an effect first.");

    const out = document.createElement("canvas"); out.width = c.width; out.height = c.height; out.getContext("2d").drawImage(c, 0, 0);
    baseFull = out; basePrev = scaled(out, MAXPREV); R1.setSource(basePrev); S = fresh(); snap(); render(); buildPanel(true); makeThumbs();

const EXP = [["High quality JPEG", 2400, "image/jpeg"], ["Standard JPEG (smaller)", 1600, "image/jpeg"], ["PNG (lossless)", 2400, "image/png"]];
let expI = 0;
$("advBtn").onclick = (e) => { e.stopPropagation(); const m = $("advMenu"); m.hidden = !m.hidden;
  m.innerHTML = EXP.map((x, i) => `<button data-i="${i}" class="${i === expI ? "on" : ""}">${x[0]}<span>${i === expI ? "✓" : ""}</span></button>`).join("");
  m.querySelectorAll("button").forEach(b => b.onclick = () => { expI = +b.dataset.i; m.hidden = true; toast("Export: " + EXP[expI][0]); }); };
document.addEventListener("click", () => { $("advMenu").hidden = true; });
$("saveBtn").onclick = async () => {
  busy(true, "Exporting…"); await new Promise(r => setTimeout(r, 30));

    const [, mx, mime] = EXP[expI]; const srcC = mx < Math.max(baseFull.width, baseFull.height) ? scaled(baseFull, mx) : baseFull;
    const rr = sharedR(); rr.setSource(srcC); rr.draw(S, false); const c = rr.canvas;

const TOOLS = [["Templates", 0], ["Retouch", 0], ["Filters", 1], ["Adjust", 1], ["Remove", 0], ["Mosaic", 0], ["Effects", 1], ["Brush", 0], ["Stickers", 0], ["Text", 0], ["AI images", 0], ["Crop", 0]];
function buildTools() {
  $("tools").innerHTML = TOOLS.map(([n, on]) => `<button data-t="${n.toLowerCase()}" class="${on ? "" : "soon"} ${tool === n.toLowerCase() ? "on" : ""}">${n}</button>`).join("");
  $("tools").querySelectorAll("button").forEach(b => b.onclick = () => {
    if (b.classList.contains("soon")) return toast(b.textContent + " is coming in a later phase.");
    tool = b.dataset.t; editing = false; buildPanel(); });
}
function sliderRow(label, val, min, max, oninput, onchange) {
  const d = document.createElement("div"); d.className = "sl";
  d.innerHTML = `<label>${label}<b>${val}</b></label><input type="range" min="${min}" max="${max}" value="${val}">`;
  const inp = d.querySelector("input"), b = d.querySelector("b");
  inp.oninput = () => { b.textContent = inp.value; oninput(+inp.value); };
  inp.onchange = () => onchange(+inp.value); return d;
}
function buildPanel(keepScroll) {
  buildTools();
  const cats = $("cats"), th = $("thumbs"), adj = $("adj"), sl = $("sliders");
  const sx = keepScroll ? th.scrollLeft : 0;
  sl.innerHTML = ""; $("rowSl").innerHTML = "";
  adj.hidden = tool !== "adjust"; th.hidden = tool === "adjust"; cats.hidden = tool === "adjust";
  if (tool === "effects") {
    cats.innerHTML = `<button data-c="-1">⌀</button>` + FX_TABS.map((t, i) => `<button data-c="${i}" class="${i === fxTab ? "on" : ""}">${t[0]}</button>`).join("") + `<button class="pill ${editing ? "on" : ""}" id="editPill">Edit</button>`;
    cats.querySelectorAll("button[data-c]").forEach(b => b.onclick = () => { const c = +b.dataset.c; if (c < 0) { S.fx = null; snap(); render(); buildPanel(true); } else { fxTab = c; buildPanel(); makeThumbs(); } });
    $("editPill").onclick = () => { if (!S.fx) return toast("Pick an effect first."); editing = !editing; buildPanel(true); };
    th.innerHTML = FX_TABS[fxTab][1].map(id => `<div class="th ${S.fx && S.fx.id === id ? "on" : ""}" data-id="${id}"><canvas width="132" height="176" data-th="fx${id}"></canvas><span>${FX[id].n}</span></div>`).join("");
    th.querySelectorAll(".th").forEach(el => el.onclick = () => {
      const id = +el.dataset.id;
      if (S.fx && S.fx.id === id) { editing = !editing; buildPanel(true); return; }
      S.fx = { id, p: FX[id].s.map(x => x[1]) }; editing = true; snap(); render(); buildPanel(true);
      if (id === 35) toast("Lens smudge v6 · Lab 6", 2500); });
    if (S.fx && editing) FX[S.fx.id].s.forEach(([name, def], i) => sl.appendChild(sliderRow(name, S.fx.p[i], 0, 100,
      v => { S.fx.p[i] = v; render(); }, () => snap())));
    if (S.fx && S.fx.id === 35) { $("view").onpointerdown = (e) => { const r = $("view").getBoundingClientRect();
      S.lc = [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height]; render(); snap(); }; }
    paintThumbs();
  } else if (tool === "filters") {
    const names = ["Favorites", ...Object.keys(FILTERS)];
    cats.innerHTML = `<button data-c="-1" aria-label="No filter">⌀</button>` + names.map((n, i) => `<button data-c="${i}" class="${i === fltTab ? "on" : ""}">${n}</button>`).join("");
    cats.querySelectorAll("button[data-c]").forEach(b => b.onclick = () => { const c = +b.dataset.c; if (c < 0) { S.filter = null; snap(); render(); buildPanel(true); } else { fltTab = c; buildPanel(); } });
    const list = fltTab === 0 ? FAVS.filter(f => FILTERS[f[0]] && FILTERS[f[0]][f[1]]) : FILTERS[names[fltTab]].map((f, i) => [names[fltTab], i]);
    if (!list.length) th.innerHTML = `<div style="color:#8d8d8d;padding:30px 12px;font-size:14px">Long press a filter to add it to Favorites.</div>`;
    else th.innerHTML = list.map(([g, i]) => `<div class="th ${S.filter && S.filter[0] === g && S.filter[1] === i ? "on" : ""}" data-g="${g}" data-i="${i}"><canvas width="132" height="176" data-th="fl|${g}|${i}"></canvas><span>${FILTERS[g][i][0]}${FAVS.some(f => f[0] === g && f[1] === i) ? " ♥" : ""}</span></div>`).join("");
    th.querySelectorAll(".th").forEach(el => {
      const g = el.dataset.g, i = +el.dataset.i; let timer = null, long = false;
      el.addEventListener("pointerdown", () => { long = false; timer = setTimeout(() => { long = true;
        const k = FAVS.findIndex(f => f[0] === g && f[1] === i); if (k >= 0) { FAVS.splice(k, 1); toast("Removed from Favorites"); } else { FAVS.push([g, i]); toast("Added to Favorites"); }
        saveFavs(); buildPanel(true); }, 520); });
      const cancel = () => clearTimeout(timer);
      el.addEventListener("pointerup", cancel); el.addEventListener("pointerleave", cancel); el.addEventListener("pointercancel", cancel);
      el.onclick = () => { if (long) return; S.filter = [g, i, 80]; snap(); render(); buildPanel(true); };
    });
    if (S.filter) $("rowSl").appendChild(sliderRow("", S.filter[2], 0, 100, v => { S.filter[2] = v; render(); }, () => snap()).querySelector("input"));
    paintThumbs();
  } else if (tool === "adjust") {
    adj.innerHTML = ADJ.map(([k, n, ic]) => `<button data-k="${k}" class="${adjKey === k ? "on" : ""}"><i>${ic}</i>${n}</button>`).join("");
    adj.querySelectorAll("button").forEach(b => b.onclick = () => { adjKey = b.dataset.k; buildPanel(true); });
    const a = ADJ.find(x => x[0] === adjKey);
    sl.appendChild(sliderRow(a[1], S.adj[adjKey], a[3], a[4], v => { S.adj[adjKey] = v; render(); }, () => snap()));
    if (adjKey === "flash") { $("view").onpointerdown = (e) => placeFlash(e); }
  }
  th.scrollLeft = sx;

}
function placeFlash(e) {

  S.fc = [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height]; if (S.adj.flash === 0) { S.adj.flash = 60; buildPanel(true); } render();
}
$("view").addEventListener("pointerup", () => { if (tool === "adjust" && adjKey === "flash") snap(); });


let thumbJob = 0, thumbSrc = null;
const thumbCache = {};
function makeThumbs() {
  thumbJob++; for (const k in thumbCache) delete thumbCache[k];
  thumbSrc = scaled(basePrev, 200); paintThumbs();
}
function paintThumbs() {
  const job = thumbJob; const cs = [...document.querySelectorAll("canvas[data-th]")];
  if (!thumbSrc) return;
  (async () => {
    if (!TR) { const c = document.createElement("canvas"); try { TR = new R(c); } catch (e) { return; } }
    TR.setSource(thumbSrc);
    for (const cv of cs) {
      if (job !== thumbJob || !cv.isConnected) continue;
      const key = cv.dataset.th;
      if (!thumbCache[key]) {
        const t = fresh();
        if (key.startsWith("fx")) { const id = +key.slice(2); t.fx = { id, p: FX[id].s.map(x => x[1]) }; }
        else { const m = key.split("|"); t.filter = [m[1], +m[2], 100]; }
        TR.draw(t, false);
        const o = document.createElement("canvas"); o.width = TR.W; o.height = TR.H; o.getContext("2d").drawImage(TR.canvas, 0, 0); thumbCache[key] = o;
      }
      const o = thumbCache[key], x = cv.getContext("2d"), k = Math.max(cv.width / o.width, cv.height / o.height);
      x.drawImage(o, (cv.width - o.width * k) / 2, (cv.height - o.height * k) / 2, o.width * k, o.height * k);
      await new Promise(r => setTimeout(r, 0));
    }
  })();
}


const LOCK = { salt: "d67f8e16e60b3c808075529b1825d7a1", iter: 150000, hash: "a67f66462f91afb7b22a89ca6064c8a3c7e6190c3ceaa8f6a2a3b4d14522da8a" };
async function derive(code) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: enc.encode(LOCK.salt), iterations: LOCK.iter, hash: "SHA-256" }, key, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, "0")).join("");
}
let entry = "";
function drawPins() { $("pins").querySelectorAll("i").forEach((el, i) => el.classList.toggle("f", i < entry.length)); }
async function tryCode(code, remember) {
  let ok = false;
  try { ok = (await derive(code)) === LOCK.hash; } catch (e) { $("lockMsg").textContent = "Open this from your https link"; return false; }
  if (ok) { if (remember) { try { localStorage.setItem("pc_hash", await derive(code)); localStorage.removeItem("pc"); } catch (e) {} } show("home"); }   // Lab6: Lab5 stored the raw passcode in localStorage; store only its PBKDF2 hash.
  return ok;
}
function press(k) {
  if (k === "del") entry = entry.slice(0, -1);
  else if (entry.length < 6) entry += k;
  drawPins();
  if (entry.length === 6) {
    const code = entry; $("lockMsg").textContent = "Checking…";
    tryCode(code, true).then(ok => {
      if (!ok) { entry = ""; drawPins(); $("lockMsg").textContent = "Wrong passcode";
        const p = $("pins"); p.classList.remove("shake"); void p.offsetWidth; p.classList.add("shake"); }
    });
  }
}
$("pad").innerHTML = ["1","2","3","4","5","6","7","8","9","","0","del"].map(k =>
  k === "" ? "<span></span>" : `<button data-k="${k}" class="${k === "del" ? "ghost" : ""}">${k === "del" ? "Delete" : k}</button>`).join("");
$("pad").querySelectorAll("button").forEach(b => b.onclick = () => press(b.dataset.k));
(() => { const ic = document.querySelector('link[rel="apple-touch-icon"]'); if (ic) $("lockLogo").style.backgroundImage = `url(${ic.href})`; })();
(async () => { let sh = null, saved = null; try { sh = localStorage.getItem("pc_hash"); saved = localStorage.getItem("pc"); } catch (e) {}
  if (sh && sh === LOCK.hash) { show("home"); return; }
  if (saved && await tryCode(saved, true)) return;   // legacy Lab5 entry: verified once, then migrated to hash storage above
  drawPins(); })();

(() => { const ic = document.querySelector('link[rel="apple-touch-icon"]'); if (ic) $("homeLogo").style.backgroundImage = `url(${ic.href})`; })();
