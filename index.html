<title>Pixie Edit</title>
<style>
  :root { --safe-t: env(safe-area-inset-top); --safe-b: env(safe-area-inset-bottom); --acc: #c8ff4d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font: 15px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; overscroll-behavior: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  [hidden] { display: none !important; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; }
  .screen.on { display: flex; }
  /* lock */
  #lock { background: #f4f1ea; color: #1d1b19; align-items: center; justify-content: center; gap: 22px; }
  #lock .logo { width: 84px; height: 84px; border-radius: 24px; background-size: cover; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
  #lock h2 { margin: 0; font-size: 20px; }
  .pins { display: flex; gap: 14px; height: 16px; }
  .pins i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #1d1b19; }
  .pins i.f { background: #1d1b19; }
  .pins.shake { animation: sh .35s; } @keyframes sh { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px; margin-top: 8px; }
  .pad button { width: 76px; height: 76px; border-radius: 50%; background: #fff; font-size: 30px; box-shadow: 0 1px 0 #e5e0d8; color: #1d1b19; }
  .pad .ghost { background: none; box-shadow: none; font-size: 16px; color: #8a847d; }
  #lockMsg { color: #8a847d; font-size: 14px; min-height: 18px; }
  /* home */
  #home { align-items: center; justify-content: center; gap: 18px; background: #0b0b0b; }
  #home .logo { width: 96px; height: 96px; border-radius: 27px; background-size: cover; }
  #home h1 { margin: 0; font-size: 26px; }
  #home p { margin: 0; color: #9a9a9a; }
  .big { background: var(--acc); color: #000; font-weight: 700; padding: 16px 34px; border-radius: 30px; font-size: 17px; }
  /* editor */
  #ed { background: #000; }
  #top { display: flex; align-items: center; justify-content: space-between; padding: calc(var(--safe-t) + 8px) 14px 6px; height: calc(var(--safe-t) + 52px); }
  .ib { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; }
  .ib svg { width: 24px; height: 24px; }
  #stage { flex: 1; position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
  #view { max-width: 100%; max-height: 100%; display: block; border-radius: 6px; touch-action: none; }
  .side { position: absolute; left: 10px; bottom: 6px; display: flex; flex-direction: column; gap: 14px; align-items: center; z-index: 3; }
  .side button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .side svg { width: 26px; height: 26px; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
  .side button:disabled { opacity: .35; }
  #ctl { display: flex; align-items: center; gap: 6px; padding: 4px 14px 2px; height: 50px; background: #000; }
  #ctl > button { width: 40px; height: 40px; display: grid; place-items: center; flex: none; }
  #ctl > button svg { width: 24px; height: 24px; }
  #ctl > button:disabled { opacity: .35; }
  #rowSl { flex: 1; display: flex; align-items: center; padding: 0 10px; }
  #rowSl input { width: 100%; }
  .topr { display: flex; align-items: center; gap: 10px; }
  .adv { display: flex; align-items: center; gap: 6px; background: #2b2b2b; padding: 9px 14px; border-radius: 9px; font-size: 16px; }
  .exp { background: var(--acc); color: #000; font-weight: 700; padding: 9px 18px; border-radius: 9px; font-size: 16px; }
  #advMenu { position: absolute; right: 14px; top: calc(100% - 2px); background: #262626; border-radius: 12px; z-index: 12; min-width: 210px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  #advMenu button { display: flex; justify-content: space-between; width: 100%; padding: 13px 16px; text-align: left; border-bottom: 1px solid #333; }
  #advMenu button.on { color: var(--acc); }
  #top { position: relative; }
  #sliders { position: absolute; left: 0; right: 0; bottom: 58px; padding: 0 16px; z-index: 3; display: flex; flex-direction: column; gap: 2px; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .sl { display: flex; align-items: center; gap: 12px; height: 38px; }
  .sl label { width: 108px; font-size: 14px; white-space: nowrap; }
  .sl label b { font-weight: 600; margin-left: 4px; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 28px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: rgba(255,255,255,.55); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; margin-top: -12px; box-shadow: 0 1px 6px rgba(0,0,0,.5); }
  #panel { background: #000; padding-bottom: var(--safe-b); }
  .cats { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding: 8px 10px 4px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cats button { padding: 6px 12px; color: #a8a8a8; font-size: 14px; white-space: nowrap; border-radius: 16px; flex: none; }
  .cats button.on { color: #fff; font-weight: 600; }
  .cats .pill { margin-left: auto; background: #2b2b2b; color: #fff; position: sticky; right: 0; }
  .cats .pill.on { background: #fff; color: #000; }
  .thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 6px 10px 10px; height: 112px; scrollbar-width: none; align-items: flex-start; }
  .thumbs::-webkit-scrollbar { display: none; }
  .th { flex: none; width: 66px; text-align: center; font-size: 11px; color: #bdbdbd; }
  .th canvas, .th .box { width: 66px; height: 88px; border-radius: 7px; background: #1c1c1c; display: block; object-fit: cover; }
  .th span { display: block; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .th.on canvas, .th.on .box { outline: 2px solid var(--acc); }
  .th.on span { color: var(--acc); }
  .th .box { display: grid; place-items: center; font-size: 22px; }
  .tools { display: flex; overflow-x: auto; scrollbar-width: none; border-top: 1px solid #151515; }
  .tools::-webkit-scrollbar { display: none; }
  .tools button { flex: none; padding: 12px 15px 10px; font-size: 14px; color: #8d8d8d; position: relative; }
  .tools button.on { color: var(--acc); font-weight: 600; }
  .tools button.on::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 22px; margin-left: -11px; height: 2px; background: var(--acc); border-radius: 2px; }
  .tools button.soon { color: #5d5d5d; }
  .adj { display: flex; gap: 6px; overflow-x: auto; padding: 8px 8px 12px; height: 112px; scrollbar-width: none; }
  .adj::-webkit-scrollbar { display: none; }
  .adj button { flex: none; width: 70px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: #a8a8a8; padding-top: 6px; }
  .adj button i { width: 44px; height: 44px; border-radius: 50%; background: #1d1d1d; display: grid; place-items: center; font-style: normal; font-size: 20px; color: #fff; }
  .adj button.on { color: var(--acc); }
  .adj button.on i { background: #2f3a12; color: var(--acc); }
  .adj button u { position: absolute; }
  #busy { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 9; }
  #busy.on { display: flex; }
  #busy span { background: #222; padding: 14px 22px; border-radius: 14px; }
  #toast { position: fixed; left: 50%; top: calc(var(--safe-t) + 64px); transform: translateX(-50%); background: rgba(40,40,40,.95); padding: 10px 16px; border-radius: 12px; z-index: 10; display: none; font-size: 14px; max-width: 86vw; text-align: center; }
</style>
</head>

<section id="lock" class="screen on">

  <div class="pad" id="pad"></div>
</section>

<section id="home" class="screen">

</section>

<section id="ed" class="screen">
  <div id="top">
    <button class="ib" id="xBtn" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <div class="topr"><button class="adv" id="advBtn">Advanced <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button><button class="exp" id="saveBtn">Export</button></div>
    <div id="advMenu" hidden></div>
  </div>
  <div id="stage">
    <canvas id="view"></canvas>
    <div class="side"><button id="mergeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9.5 5.5L12 8l2.5-2.5"/><path d="M12 10l8 4-8 4-8-4z"/><path d="M4 17l8 4 8-4"/></svg>Merge layers</button></div>
    <div id="sliders"></div>
  </div>
  <div id="panel">
    <div id="ctl">
      <button id="undoBtn" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 0 1 0 12"/></svg></button>
      <button id="redoBtn" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l5 5-5 5M20 12H10a6 6 0 0 0 0 12"/></svg></button>
      <div id="rowSl"></div>
      <button id="cmpBtn" aria-label="Hold to compare"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="16" rx="1.5"/><rect x="13" y="4" width="8" height="16" rx="1.5"/></svg></button>
    </div>
    <div class="cats" id="cats"></div>
    <div class="thumbs" id="thumbs"></div>
    <div class="adj" id="adj" hidden></div>
    <div class="tools" id="tools"></div>
  </div>
</section>
